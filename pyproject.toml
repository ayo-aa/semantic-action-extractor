[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-action-extractor"
version = "0.4.0.dev2"
description = "Research scaffold for predicate-conditioned PropBank role labeling and rule-based action extraction."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Ayo Adetayo"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
neural = [
  "torch>=2.2,<3",
  "transformers>=4.40,<6",
]

[project.scripts]
semantic-action-extractor = "semantic_action_extractor.cli:main"
semantic-action-prepare-babysrl = "semantic_action_extractor.srl.babysrl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_action_extractor = ["py.typed"]
